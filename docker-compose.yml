version: "3.8"
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      # Model used by backend.app is /app/backend/final_model.pkl
      - ./backend/final_model.pkl:/app/backend/final_model.pkl
      - ./dataset:/app/dataset
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # S3 logging (optional)
      - S3_BUCKET=${S3_BUCKET}
      - S3_PREFIX=${S3_PREFIX:-agri}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
  mlflow:
    image: mlfloworg/mlflow:latest
    ports:
      - "5000:5000"
  prometheus:
    image: prom/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
