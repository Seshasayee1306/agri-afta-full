apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-store-pvc
spec:
  accessModes:
    - ReadWriteOnce
  # Uses the cluster's default StorageClass (recommended for local docker-desktop too).
  # Set storageClassName explicitly if your cluster doesn't have a default.
  resources:
    requests:
      storage: 1Gi
